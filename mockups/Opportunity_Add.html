<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Opportunity</title><style>
*{box-sizing:border-box}
:root{--bg:#dce8f1;--panel:#fff;--line:#cbd4da;--text:#4b5660;--blue:#1e73be;--teal:#15c4c8;--orange:#f5b041;--red:#d9534f;--green:#4c8b58;--purple:#2e006b}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.page-head{background:#fff;border-top:5px solid var(--purple);border-bottom:1px solid #c9d3da;padding:16px 20px 17px}
.page-title{font-size:20px;color:#666;margin-bottom:9px}.crumbs{color:#6c7881}.crumbs span{margin:0 7px;color:#aaa}
.wrap{margin:22px 28px}.section-box,.card{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.section-box{padding:14px;margin-bottom:18px}.card{margin-bottom:16px}.card-head{padding:11px 14px;background:#f5f5f5;border-bottom:1px solid #d9dfe4;font-weight:700}.card-body{padding:14px}
.btn{border:1px solid #d6dbe0;background:#fff;color:#59656e;padding:8px 13px;cursor:pointer;border-radius:2px;white-space:nowrap}.btn:hover{background:#f7f9fa}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.btn-view{background:var(--teal);border-color:var(--teal);color:#fff}.btn-edit{background:var(--orange);border-color:var(--orange);color:#fff}.btn-danger{background:var(--red);border-color:var(--red);color:#fff}.btn-small{padding:5px 9px;font-size:11px}
.top-actions,.quick-row,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top-actions{justify-content:space-between}.actions{justify-content:flex-end;margin-top:14px}
.filters{display:grid;grid-template-columns:1.2fr 1.2fr .9fr .9fr .9fr auto;gap:16px;align-items:end}
.field label{display:block;margin-bottom:6px;font-weight:700;color:#59656e}.field input,.field select,.field textarea{width:100%;border:1px solid #c7c7c7;background:#fff;color:#555;padding:7px 9px;border-radius:2px}
.field input,.field select{height:34px}.field textarea{min-height:82px;resize:vertical}.readonly{background:#f2f4f5!important;color:#777!important}
.date-range{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cfl{display:flex}.cfl input{border-radius:2px 0 0 2px}.cfl button{width:36px;border:1px solid #c7c7c7;border-left:0;background:#f6f6f6}
.quick-row{margin-top:14px;padding-top:12px;border-top:1px solid #ececec}.quick-label{font-weight:700}
.table-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.table-tools-left{display:flex;align-items:center;flex-wrap:wrap}
.entries-box,.search-box{display:flex;align-items:center;gap:8px}.entries-box{margin-right:4px}.entries-box select{width:70px;height:30px}.search-box input{width:220px;height:30px}
.table-general-tools{display:flex}.table-general-tools .btn{border-radius:0;margin-left:-1px}.table-general-tools .btn:first-child{margin-left:0;border-radius:2px 0 0 2px}.table-general-tools .btn:last-child{border-radius:0 2px 2px 0}
.table-outer{overflow:auto;border:1px solid #e0e0e0}.data-table{width:100%;min-width:1260px;border-collapse:separate;border-spacing:0}
.data-table th{background:#f5f5f5;color:#666;padding:10px 8px;text-align:left;border-right:1px solid #dfdfdf;border-bottom:1px solid #dfdfdf;white-space:nowrap}.data-table td{padding:9px 8px;border-right:1px solid #e7e7e7;border-bottom:1px solid #e7e7e7;vertical-align:top;background:#fff}
.data-table th:last-child,.data-table td:last-child{border-right:none}.action-col{position:sticky;right:0;z-index:2;background:#f5f5f5!important;box-shadow:-2px 0 4px rgba(0,0,0,.05)}.data-table td.action-col{background:#fff!important}.row-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.status{display:inline-block;min-width:66px;text-align:center;padding:4px 7px;border:1px solid;border-radius:2px;font-size:11px;font-weight:700}.status.open{color:#337ab7;background:#f1f7fc;border-color:#acd0eb}.status.won{color:#3c763d;background:#f0f8f0;border-color:#b7d6b8}.status.lost{color:#a94442;background:#fff2f2;border-color:#e5b6b5}
.tag{display:inline-block;padding:3px 6px;border:1px solid #cbd7e0;background:#f8fbfd;color:#5d6e7b;font-size:10px}.helper{font-size:10px;color:#89939b;margin-top:5px;line-height:1.4}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 2px}.pagination{display:flex}.pagination button{border:1px solid #d7d7d7;background:#fff;padding:6px 10px}.pagination button+button{margin-left:-1px}.pagination .active{background:#f4f4f4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 18px}.span2{grid-column:span 2}.span3{grid-column:span 3}
.stage-table{width:100%;border-collapse:collapse}.stage-table th,.stage-table td{border:1px solid #e0e5e9;padding:8px;text-align:left;vertical-align:middle}.stage-table th{background:#f5f5f5}.stage-table input,.stage-table select{width:100%;height:32px;border:1px solid #c7c7c7;padding:6px 8px}.stage-action{display:flex;gap:5px;flex-wrap:wrap}
.tabs{display:flex;border-bottom:1px solid #ddd;margin-bottom:12px}.tab{padding:10px 16px;border:1px solid transparent;border-bottom:0;cursor:pointer}.tab.active{border-color:#ddd;background:#fff;font-weight:700;border-radius:3px 3px 0 0}
.summary-grid{display:grid;grid-template-columns:180px 1fr;gap:16px}.summary-status{border:1px solid #dfe5e9;background:#fafcfd;padding:20px;text-align:center}.summary-status b{display:block;font-size:24px;margin-top:8px}
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;align-items:center;justify-content:center;padding:20px}.modal-wrap.show{display:flex}.modal{width:650px;max-width:96vw;max-height:90vh;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column}.modal.wide{width:900px}
.modal-head{padding:13px 15px;border-bottom:1px solid #ddd;background:#f5f5f5;display:flex;justify-content:space-between;align-items:center;font-weight:700}.modal-body{padding:15px;overflow:auto}.modal-actions{padding:10px 15px;border-top:1px solid #ddd;display:flex;justify-content:flex-end;gap:8px}.close-x{border:0;background:none;font-size:18px;color:#777}
.choice{display:flex;gap:22px;align-items:center;margin-bottom:14px}.choice label{display:flex;gap:7px;align-items:center;font-size:13px}.choice input{width:auto;height:auto}
.toast{position:fixed;right:20px;bottom:20px;background:#3d444b;color:#fff;padding:10px 14px;display:none;z-index:120}.toast.show{display:block}
@media(max-width:1150px){.filters{grid-template-columns:1fr 1fr 1fr}.filters .filter-btn-wrap{grid-column:span 3}.grid3{grid-template-columns:1fr 1fr}.span3{grid-column:span 2}}
@media(max-width:800px){.wrap{margin:12px}.filters,.grid2,.grid3{grid-template-columns:1fr}.filters .filter-btn-wrap,.span2,.span3{grid-column:auto}.table-tools{flex-direction:column;align-items:flex-start}.summary-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="page-head"><div class="page-title">Tambah Opportunity</div><div class="crumbs">Beranda <span>/</span> Transaksi <span>/</span> Opportunity <span>/</span> Tambah Opportunity</div></div>
<div class="wrap">
<div class="card"><div class="card-head">Informasi Customer</div><div class="card-body"><div class="grid2">
<div class="field"><label>Kode Customer *</label><div class="cfl"><input id="bpCode" value="L000032" readonly><button type="button" onclick="toggleBP()">...</button></div><div class="helper">Customer dapat berupa BP tipe Lead maupun Customer.</div></div><div class="field"><label>Nama Customer</label><input id="bpName" class="readonly" value="CV BERKAH JAYA" disabled></div>
<div class="field"><label>Grup</label><input id="bpGroup" class="readonly" value="PROSPECT" disabled></div><div class="field"><label>Industri</label><input id="bpIndustry" class="readonly" value="RETAIL" disabled></div>
</div></div></div>
<div class="card"><div class="card-head">Informasi Opportunity</div><div class="card-body"><div class="grid3">
<div class="field"><label>Nama Opportunity *</label><input value="NEW OUTLET"></div><div class="field"><label>Stage Awal *</label><select><option>Introduction</option><option>Quotation</option><option>Negotiation</option></select><div class="helper">Saat Simpan, Stage Awal menjadi Detail Stage Line 1.</div></div><div class="field"><label>Sumber</label><select><option>Referral</option><option>Telemarketing</option><option>Broadcast</option></select></div>
<div class="field"><label>Tanggal Mulai *</label><input type="date" value="2026-09-18"></div><div class="field"><label>Prediksi Tanggal Tutup *</label><input type="date" value="2026-09-30"></div><div class="field"><label>Nilai Potensial</label><input type="number" value="5000000"></div>
<div class="field"><label>Rentang Minat</label><select><option>Feed</option><option>DOC</option><option>General</option></select></div><div class="field"><label>Kompetitor</label><select><option>-</option><option>Kompetitor A</option></select></div><div class="field"><label>Tingkat Ketertarikan</label><select><option>Aware (Low Interest)</option><option>Engaged (High Interest)</option></select></div>
<div class="field span3"><label>Keterangan</label><textarea placeholder="Masukkan keterangan jika ada"></textarea></div></div></div></div>
<div class="actions"><button class="btn" onclick="location.href='PATRIOT_Opportunity_List_v1.html'">Kembali</button><button class="btn btn-primary" onclick="alert('Mockup: Opportunity tersimpan dan Stage Awal dibuat sebagai Line 1.')">Simpan</button></div>
</div><script>let lead=true;function toggleBP(){lead=!lead;document.getElementById('bpCode').value=lead?'L000032':'CWS00189';document.getElementById('bpName').value=lead?'CV BERKAH JAYA':'CAHAYA INTERLINING PERKASA';document.getElementById('bpGroup').value=lead?'PROSPECT':'WHOLESALE/STOCKIST';document.getElementById('bpIndustry').value=lead?'RETAIL':'AGENT'}</script></body></html>
